name: Deploy

on:
  workflow_dispatch:
    inputs:
      deploy_api:
        description: 'Pull + deploy the Laravel API image?'
        type: boolean
        default: true
      deploy_angular:
        description: 'Pull + deploy the Angular image?'
        type: boolean
        default: true

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_API: ${{ inputs.deploy_api }}
          DEPLOY_ANGULAR: ${{ inputs.deploy_angular }}
        timeout-minutes: 30
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 30m
          envs: DEPLOY_API, DEPLOY_ANGULAR
          script: |
            if [ -d /opt/freelancescope/.git ]; then
              cd /opt/freelancescope && git pull origin master
            else
              sudo rm -rf /opt/freelancescope
              sudo git clone https://x-access-token:${{ secrets.GH_PAT }}@github.com/Pro-joseph/Repository_dispatch_FreelanceScope.git /opt/freelancescope
            fi
            sudo chown -R ubuntu:ubuntu /opt/freelancescope || true
            cd /opt/freelancescope
            cat > .env << 'ENVEOF'
            APP_KEY=${{ secrets.APP_KEY }}
            APP_DEBUG=false
            APP_URL=http://${{ secrets.EC2_HOST }}
            CACHE_STORE=file
            TELESCOPE_ENABLED=true
            DB_CONNECTION=mysql
            DB_HOST=db
            DB_PORT=3306
            DB_DATABASE=freelancescope
            DB_USERNAME=freelancescope
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_ROOT_PASSWORD=${{ secrets.DB_ROOT_PASSWORD }}
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            OPENAI_BASE_URL=https://api.groq.com/openai/v1
            ENVEOF
            fallocate -l 1G /swapfile 2>/dev/null
            chmod 600 /swapfile 2>/dev/null
            mkswap /swapfile 2>/dev/null
            swapon /swapfile 2>/dev/null

            if [ "$DEPLOY_API" = "true" ]; then
              docker compose pull app
            fi
            if [ "$DEPLOY_ANGULAR" = "true" ]; then
              docker compose pull angular
            fi

            docker compose up -d db
            echo "Waiting for MySQL..."
            for i in $(seq 1 60); do
              if docker compose exec -T db mysqladmin ping -h localhost --silent 2>/dev/null; then
                echo "DB ready"
                break
              fi
              sleep 5
            done

            docker compose up -d
            for i in $(seq 1 30); do
              if docker compose exec -T app php artisan --version >/dev/null 2>&1; then
                echo "App ready"
                break
              fi
              sleep 5
            done

            docker compose exec -T db mysql -uroot -p"$DB_ROOT_PASSWORD" \
              -e "GRANT ALL ON freelancescope.* TO 'freelancescope'@'%'; FLUSH PRIVILEGES;" 2>/dev/null || true

            docker compose exec -T app php artisan migrate --force

            docker compose restart nginx
            echo "Deploy complete!"
