name: Deploy

on:
  repository_dispatch:
    types: [deploy]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        timeout-minutes: 30
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 30m
          script: |
            if [ -d /opt/freelancescope/.git ]; then
              cd /opt/freelancescope && git pull origin master
            else
              sudo rm -rf /opt/freelancescope
              sudo git clone https://x-access-token:${{ secrets.GH_PAT }}@github.com/Pro-joseph/Repository_dispatch_FreelanceScope.git /opt/freelancescope
            fi
            sudo chown -R ubuntu:ubuntu /opt/freelancescope || true
            cd /opt/freelancescope
            cat > .env << ENVEOF
            APP_KEY=${{ secrets.APP_KEY }}
            APP_DEBUG=false
            APP_URL=http://${{ secrets.EC2_HOST }}
            CACHE_STORE=file
            TELESCOPE_ENABLED=false
            DB_CONNECTION=mysql
            DB_HOST=db
            DB_PORT=3306
            DB_DATABASE=freelancescope
            DB_USERNAME=freelancescope
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_ROOT_PASSWORD=${{ secrets.DB_ROOT_PASSWORD }}
            OPENAI_API_KEY=${{ secrets.GROQ_API_KEY }}
            OPENAI_BASE_URL=https://api.groq.com/openai/v1
            ENVEOF
            fallocate -l 1G /swapfile 2>/dev/null
            chmod 600 /swapfile 2>/dev/null
            mkswap /swapfile 2>/dev/null
            swapon /swapfile 2>/dev/null

            docker compose pull

            docker compose up -d db
            echo "Waiting for MySQL..."
            for i in $(seq 1 60); do
              if docker compose exec -T db mysqladmin ping -h localhost --silent 2>/dev/null; then
                echo "DB ready"
                break
              fi
              sleep 5
            done

            docker compose up -d
            for i in $(seq 1 30); do
              if docker compose exec -T app php artisan --version >/dev/null 2>&1; then
                echo "App ready"
                break
              fi
              sleep 5
            done

            docker compose exec -T db mysql -uroot -p"$DB_ROOT_PASSWORD" \
              -e "GRANT ALL ON freelancescope.* TO 'freelancescope'@'%'; FLUSH PRIVILEGES;" 2>/dev/null || true

            docker compose exec -T app php artisan migrate --force
            echo "Deploy complete!"
