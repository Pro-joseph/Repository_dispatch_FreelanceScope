name: Deploy FreelanceScope

on:
  push:
    branches: ["master"]

jobs:
  terraform:
    runs-on: ubuntu-latest
    outputs:
      vm_ip: ${{ steps.vmip.outputs.ip }}
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"

      - name: Write SSH public key
        run: echo "${{ secrets.SSH_PUBLIC_KEY }}" > terraform/id_ed25519.pub

      - env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: eu-west-3
        working-directory: terraform
        run: |
          VARS="-var ssh_public_key_path=./id_ed25519.pub"

          # Create S3 state bucket if needed
          aws s3api create-bucket \
            --bucket freelancescope-terraform-state \
            --region eu-west-3 \
            --create-bucket-configuration LocationConstraint=eu-west-3 \
            2>/dev/null || true

          terraform init

          # Import existing resources so Terraform adopts them
          SG_ID=$(aws ec2 describe-security-groups --filters Name=group-name,Values=freelancescope-sg --query 'SecurityGroups[0].GroupId' --output text)
          if [ "$SG_ID" != "None" ] && [ -n "$SG_ID" ]; then
            terraform import $VARS aws_security_group.freelancescope "$SG_ID" 2>/dev/null || true
          fi

          terraform import $VARS aws_key_pair.freelancescope freelancescope-key 2>/dev/null || true

          terraform apply -auto-approve $VARS

      - id: vmip
        working-directory: terraform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: eu-west-3
        run: echo "ip=$(terraform output -raw public_ip)" >> $GITHUB_OUTPUT

  dispatch-laravel:
    needs: terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.LARAVEL_REPO_PAT }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: 'Pro-joseph',
              repo: 'FreelanceScope',
              event_type: 'build-and-push',
            });

  dispatch-angular:
    needs: terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.ANGULAR_REPO_PAT }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: 'Pro-joseph',
              repo: 'FreelanceScope_Angular',
              event_type: 'build-and-push',
            });

  deploy:
    needs: [terraform, dispatch-laravel, dispatch-angular]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Wait for SSH
        run: |
          host=${{ needs.terraform.outputs.vm_ip }}
          for i in $(seq 1 30); do
            if bash -c "</dev/tcp/$host/22" >/dev/null 2>&1; then
              echo "SSH ready"
              exit 0
            fi
            sleep 10
          done
          echo "SSH not available"
          exit 1

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        timeout: 15m
        with:
          host: ${{ needs.terraform.outputs.vm_ip }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            if [ -d /opt/freelancescope/.git ]; then
              cd /opt/freelancescope && git pull origin master
            else
              sudo rm -rf /opt/freelancescope
              sudo git clone https://x-access-token:${{ secrets.GH_PAT }}@github.com/Pro-joseph/Repository_dispatch_FreelanceScope.git /opt/freelancescope
            fi
            sudo chown -R ubuntu:ubuntu /opt/freelancescope || true
            cd /opt/freelancescope 2>/dev/null || exit 1
            cat > .env << ENVEOF
            APP_KEY=${{ secrets.APP_KEY }}
            APP_DEBUG=false
            APP_URL=http://${{ needs.terraform.outputs.vm_ip }}
            DB_CONNECTION=mysql
            DB_HOST=db
            DB_PORT=3306
            DB_DATABASE=freelancescope
            DB_USERNAME=freelancescope
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_ROOT_PASSWORD=${{ secrets.DB_ROOT_PASSWORD }}
            GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
            ENVEOF
            sudo systemctl start docker 2>/dev/null || true
            docker compose pull
            docker compose up -d --wait
            echo "Running migrations..."
            docker compose exec -T app php artisan migrate --force
            echo "Deploy complete!"
