services:
  nginx:
    image: nginx:alpine
    container_name: freelancescope-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - freelancescope
    restart: unless-stopped

  app:
    image: joseph0070/freelancescope:api-latest
    container_name: freelancescope-app
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - freelancescope
    restart: unless-stopped

  queue:
    image: joseph0070/freelancescope:api-latest
    container_name: freelancescope-queue
    command: sh -c "php artisan queue:work --tries=3"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - freelancescope
    restart: unless-stopped

  angular:
    image: joseph0070/freelancescope:angular-latest
    container_name: freelancescope-angular
    networks:
      - freelancescope
    restart: unless-stopped

  db:
    image: mysql:8.4
    container_name: freelancescope-db
    environment:
      MYSQL_DATABASE: freelancescope
      MYSQL_USER: freelancescope
      MYSQL_PASSWORD: "${DB_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
    networks:
      - freelancescope
    restart: unless-stopped

networks:
  freelancescope:
    driver: bridge

volumes:
  mysql_data:
